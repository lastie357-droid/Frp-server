name: Build and Redeploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and push Docker image
        run: |
          docker build -t yourdockerhubuser/yourimage:latest .
          docker push yourdockerhubuser/yourimage:latest

      - name: Trigger Zeabur Redeploy
        run: |
          curl -X POST https://gateway.zeabur.com/graphql \
            -H "Authorization: Bearer ${{ secrets.ZEABUR_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { redeployService(serviceID: \"service-698e2c71eceac33904f6928b\") }"
            }'
